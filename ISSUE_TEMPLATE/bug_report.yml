name: Bug report
description: Something doesn't work when running a Flutter app on webOS.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **leave out personal data**: TV IP address, serial number, MAC address, account names or tokens.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - legacy-webos (packager, shims, --legacy builds)
        - flutter-webos CLI (build, run, install)
        - A plugin (say which below)
        - Video / audio / DRM playback
        - Rendering or performance
        - Remote control / input
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: webos
    attributes:
      label: webOS release on the TV
      options:
        - webOS 26
        - webOS 22-25
        - webOS 6
        - webOS 5
        - webOS 4
        - webOS 3 or older
        - Not sure
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model and firmware version
      description: Settings > General > About This TV (or Support > TV Information).
      placeholder: "e.g. OLED65C1 (2021), webOS TV 6.5.3, firmware 03.xx.xx"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: flutter-webos / plugins version
      description: Commit hash or date of the repos you built with, and the plugin name if relevant.
      placeholder: "flutter-webos 5861529, plugins bfb91dc, video_player"
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - Skia (default)
        - Impeller (enable-impeller in flutter-conf.json)
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal app or code snippet helps most.
      placeholder: |
        1. flutter-webos build webos --release --legacy
        2. Install on the TV and launch
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`compat.log` next to the installed app binary (older webOS builds), build output, or crash text. Remove personal data first."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed personal data (IP, serial, MAC, accounts) from everything above.
          required: true
